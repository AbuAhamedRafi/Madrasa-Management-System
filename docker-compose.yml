services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mms_backend_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=mms_db
      - DB_USERNAME=mms_user
      - DB_PASSWORD=mms_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mms_backend_network

  web:
    image: nginx:alpine
    container_name: mms_backend_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mms_backend_network

  postgres:
    image: postgres:18.6-alpine
    container_name: mms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mms_db
      POSTGRES_USER: mms_user
      POSTGRES_PASSWORD: mms_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms_user -d mms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mms_backend_network

  redis:
    image: redis:7-alpine
    container_name: mms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mms_backend_network

networks:
  mms_backend_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
